services:
  - type: web
    name: study-sprint-planner
    runtime: node
    plan: free
    buildCommand: node scripts/render-build.mjs
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
